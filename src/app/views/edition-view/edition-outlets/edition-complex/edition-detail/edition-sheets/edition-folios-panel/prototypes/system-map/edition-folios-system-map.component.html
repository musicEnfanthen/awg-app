<!-- Edition Folios System Map (prototype) -->
@if (folios().length > 0) {
    @let hovered = hoveredSigle();
    @let activeId = selectedSegmentId();

    <div class="awg-edition-folios-system-map">
        <svg
            class="awg-edition-folios-system-map-svg"
            role="img"
            aria-label="Systemkarte der Folios"
            [class.has-hover]="hovered !== null"
            [attr.width]="svgWidth()"
            [attr.height]="svgHeight()"
            [attr.viewBox]="'0 0 ' + svgWidth() + ' ' + svgHeight()">
            <!-- row axis: system numbers -->
            @for (row of rows(); track row) {
                <text
                    class="awg-system-map-axis-label"
                    text-anchor="end"
                    dominant-baseline="central"
                    [attr.x]="axisWidth - 6"
                    [attr.y]="headerHeight + (row - 0.5) * rowHeight">
                    {{ row }}
                </text>
            }

            <!-- folio columns: header and system rows -->
            @for (column of columns(); track column.folioId) {
                <g class="awg-system-map-column">
                    <text
                        class="awg-system-map-column-header"
                        text-anchor="middle"
                        [attr.x]="column.x + columnWidth / 2"
                        [attr.y]="headerHeight - 10">
                        Bl. {{ column.folioId }}{{ column.reversed ? ' ↻' : '' }}
                        @if (column.reversed) {
                            <title>Bl. {{ column.folioId }} (gedreht beschrieben)</title>
                        }
                    </text>
                    @for (row of rows(); track row) {
                        @if (row <= column.numberOfSystems) {
                            <rect
                                class="awg-system-map-row"
                                [class.odd]="row % 2 === 1"
                                [attr.x]="column.x"
                                [attr.y]="headerHeight + (row - 1) * rowHeight"
                                [attr.width]="columnWidth"
                                [attr.height]="rowHeight" />
                        }
                    }
                </g>
            }

            <!-- content bars -->
            @for (bar of bars(); track bar.key) {
                <g
                    class="awg-system-map-bar"
                    tabindex="0"
                    role="button"
                    [attr.aria-label]="bar.tooltip"
                    [class.selectable]="bar.selectable"
                    [class.active]="bar.sheetTarget.sheetId === activeId"
                    [class.highlighted]="bar.sigle === hovered"
                    (mouseenter)="hoveredSigle.set(bar.sigle)"
                    (mouseleave)="hoveredSigle.set(null)"
                    (focus)="hoveredSigle.set(bar.sigle)"
                    (blur)="hoveredSigle.set(null)"
                    (awgClick)="onBarSelect(bar)">
                    <title>{{ bar.tooltip }}</title>
                    <rect
                        class="awg-system-map-bar-shape"
                        rx="3"
                        [attr.x]="bar.x"
                        [attr.y]="bar.y"
                        [attr.width]="bar.width"
                        [attr.height]="bar.height" />
                    @if (bar.showLabel) {
                        <svg [attr.x]="bar.x" [attr.y]="bar.y" [attr.width]="bar.width" [attr.height]="bar.height">
                            <text class="awg-system-map-bar-label" x="4" dominant-baseline="hanging" y="3">
                                {{ bar.sigle }}
                            </text>
                        </svg>
                    }
                </g>
            }
        </svg>
    </div>
}
